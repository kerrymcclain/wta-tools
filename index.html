<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tools · West Texas Analytics</title>
<meta name="description" content="Free tools from West Texas Analytics, LLC · San Angelo, Texas">
<meta name="theme-color" content="#24394A">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --sky:#24394A; --ink:#1A2A37; --cream:#FFF6D8; --ground:#FDF4D9; --rule:#A8957A; --sun:#D98A3D; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: Roboto, system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--sky); color: var(--cream); padding: 28px clamp(20px, 6vw, 96px) 40px; border-bottom: 3px solid var(--sun); }
  .top { display: flex; align-items: center; gap: 24px; }
  .top nav { margin-left: auto; display: flex; gap: 22px; }
  .top nav a { color: var(--cream); text-decoration: none; font-weight: 500; font-size: 15px; opacity: 0.85; padding: 4px 0; border-bottom: 2px solid transparent; }
  .top nav a:hover, .top nav a[aria-current] { opacity: 1; border-bottom-color: var(--sun); }
  .mark { font-family: Bitter, Georgia, serif; font-weight: 700; font-size: 20px; color: var(--cream); text-decoration: none; letter-spacing: -0.02em; }
  h1 { font-family: Bitter, Georgia, serif; font-weight: 700; font-size: clamp(30px, 5vw, 44px); margin: 36px 0 6px; letter-spacing: -0.02em; }
  header p { margin: 0; opacity: 0.85; }
  main { flex: 1; padding: 32px clamp(20px, 6vw, 96px) 48px; max-width: 960px; width: 100%; }
  .tool { display: block; text-decoration: none; color: var(--ink); background: #fff; border: 1px solid #E7DCC0; border-radius: 10px; padding: 20px 22px; max-width: 560px; }
  .tool:hover, .tool:focus-visible { border-color: var(--sky); }
  .tool:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; }
  .tool h2 { font-family: Bitter, Georgia, serif; font-size: 21px; margin: 0 0 6px; }
  .tool p { margin: 0; line-height: 1.5; color: #3B4A57; }
  .tool span { display: inline-block; margin-top: 12px; font-weight: 500; color: var(--sky); }
  footer { padding: 20px clamp(20px, 6vw, 96px); font-size: 14px; color: #4A5560; border-top: 1px solid #E7DCC0; }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <div class="top">
    <a class="mark" href="https://westtexasanalytics.com" title="West Texas Analytics home">WTA</a>
    <nav aria-label="Main">
      <a href="/" aria-current="page">Tools</a>
      <a href="mailto:kerry@wta.llc">Contact</a>
    </nav>
  </div>
  <h1>Tools</h1>
  <p>Free tools from West Texas Analytics, LLC</p>
</header>
<main>
  <a class="tool" href="/tax-code/">
    <h2>Property Tax Code Search</h2>
    <p>Search every page of the Texas Property Tax Code, see each match in context, and jump straight to it in the PDF.</p>
    <span>Open the tool ›</span>
  </a>
</main>
<footer>
  <a href="https://westtexasanalytics.com">West Texas Analytics, LLC</a> · San Angelo, Texas · <a href="mailto:kerry@wta.llc">kerry@wta.llc</a>
</footer>
</body>
</html>
